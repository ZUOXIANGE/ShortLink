# 管理后台是 SPA，路由由前端自己接管：
# 直接把 /links/123 这类地址打到静态服务器上会 404，必须回落到 index.html。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 框架文件（.dll/.wasm/.dat）必须与 index.html 版本严格一致，
    # 一旦被浏览器或中间层缓存住，升级后会出现「新旧程序集混用」的诡异报错。
    location ~* \.(wasm|dll|dat|blat|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 带指纹的静态资源可以长期缓存
    location /_framework/ {
        include /etc/nginx/mime.types;
        types {
            application/wasm wasm;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
